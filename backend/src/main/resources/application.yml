spring:
  application:
    name: emotion-elearning-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:emotion_elearning}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # Flyway quan ly schema -> JPA chi validate, khong tu sinh/sua bang
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Gioi han upload: video bai giang co the toi 500MB (~1.5 tieng), can nang len dang ke so voi
  # mac dinh (1MB) cua Spring. 550MB de co du dia troi cho video ~500MB + metadata multipart.
  servlet:
    multipart:
      max-file-size: 550MB
      max-request-size: 550MB
      # Ghi file tam ra dia ngay khi > 10MB thay vi giu het trong RAM -> tranh OOM voi video lon
      file-size-threshold: 10MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # Mac dinh Tomcat chi "swallow" toi 2MB khi tra loi loi som (vd file vuot han muc) -> voi
    # request 500MB se bi reset connection thay vi client nhan duoc thong bao loi ro rang.
    max-swallow-size: -1

app:
  storage:
    # local     : luu vao thu muc uploads/ tren dia server, serve qua /uploads/** (xem WebMvcConfig).
    #             Chi phu hop DEV - mat file khi redeploy/container restart, khong co CDN.
    # cloudinary: luu len Cloudinary (anh/audio/video), tra ve URL CDN truc tiep. Xem
    #             CloudinaryFileStorageService va CloudinaryProperties o duoi. Can goi Cloudinary
    #             tra phi (Plus tro len) de upload duoc video >100MB - xem ghi chu trong
    #             CloudinaryFileStorageService.
    provider: ${STORAGE_PROVIDER:local}
    upload-dir: ${UPLOAD_DIR:uploads}
    public-base-url: /uploads
    max-file-size-mb: 550
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
    folder: ${CLOUDINARY_FOLDER:elearning}
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-.env-it-must-be-at-least-32-chars}
    access-token-minutes: 120
    refresh-token-days: 7
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  emotion:
    # frame | pre_labeled -> quyet dinh endpoint nao dang duoc dung mac dinh o phia frontend (chi de tham khao, khong bat buoc)
    default-mode: frame
    batch-size: 6
    capture-interval-seconds: 10
    min-confidence-threshold: 0.5   # BR-11
  ai-service:
    # Dia chi ai-service (Python). Doi khi ban cua ban deploy that.
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    timeout-ms: 4000
